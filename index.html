<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>胃肠镜教育助手 | 注册与登录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">HX</span>
        <div>
          <div class="brand-title">胃肠镜教育助手</div>
          <div class="brand-sub">术前教育 · 术后恢复 · 智能随访</div>
        </div>
      </div>
      <div></div>
      <a class="btn btn-primary" href="app.html">以访客模式浏览页面</a>
    </header>

    <main>
      <section id="auth" class="view is-active">
        <div class="grid auth-grid">
          <div class="hero">
            <div class="hero-badge">专业 · 温和 · 易懂</div>
            <h1>胃肠镜检查前后，清晰且可信的指导</h1>
            <p class="hero-text">
              面向患者的术前教育与术后恢复建议系统，结合可视化流程与智能问答，帮助患者理解准备事项、风险提示与恢复计划。
            </p>
            <div class="hero-cards">
              <div class="mini-card">
                <div class="mini-title">术前准备</div>
                <div class="mini-desc">清晰的饮食与用药禁忌提示</div>
              </div>
              <div class="mini-card">
                <div class="mini-title">术后恢复</div>
                <div class="mini-desc">症状监测与分级处理建议</div>
              </div>
              <div class="mini-card">
                <div class="mini-title">智能问答</div>
                <div class="mini-desc">24小时常见问题实时解答</div>
              </div>
            </div>
          </div>

          <div class="panel auth-panel">
            <div class="tab-header">
              <button class="tab is-active" data-auth="login">登录</button>
              <button class="tab" data-auth="register">注册</button>
            </div>
            <form class="form" id="login-form">
              <label class="field">
                <span>账号</span>
                <input type="text" name="account" placeholder="请输入账号" autocomplete="username" required />
              </label>
              <label class="field">
                <span>密码</span>
                <div class="input-row">
                  <input id="login-password" type="password" name="password" placeholder="输入密码" autocomplete="current-password" required />
                  <button type="button" class="toggle" data-toggle="login-password">显示</button>
                </div>
              </label>
              <div class="form-message" id="login-message"></div>
              <button type="submit" class="btn btn-primary full">安全登录</button>
            </form>

            <form class="form is-hidden" id="register-form">
              <label class="field">
                <span>姓名</span>
                <input type="text" name="name" placeholder="输入真实姓名" autocomplete="name" required />
              </label>
              <label class="field">
                <span>账号</span>
                <input type="text" name="account" placeholder="设置登录账号" autocomplete="username" required />
              </label>
              <label class="field">
                <span>密码</span>
                <div class="input-row">
                  <input id="register-password" type="password" name="password" placeholder="设置登录密码" autocomplete="new-password" required />
                  <button type="button" class="toggle" data-toggle="register-password">显示</button>
                </div>
              </label>
              <label class="field">
                <span>确认密码</span>
                <div class="input-row">
                  <input id="register-confirm" type="password" name="confirmPassword" placeholder="再次输入密码" autocomplete="new-password" required />
                  <button type="button" class="toggle" data-toggle="register-confirm">显示</button>
                </div>
              </label>
              <div class="form-message" id="register-message"></div>
              <button type="submit" class="btn btn-primary full">创建账户</button>
              <p class="form-note">注册即表示同意平台隐私与告知说明</p>
            </form>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    // 页面加载时检查登录状态，已登录则跳转到 app.html
    // 未登录用户可以选择直接进入系统（访客模式）
    (function checkLogin() {
      try {
        const token = localStorage.getItem('gi_token');
        const user = localStorage.getItem('gi_user');
        const hash = window.location.hash;

        if (token && user) {
          // 已登录，检查是否需要恢复之前的视图
          if (hash.startsWith('#view=')) {
            window.location.href = 'app.html' + hash;
          } else {
            window.location.href = 'app.html#view=chat';
          }
        } else {
          // 未登录，只有当 hash 参数不仅仅是默认的 #view=chat 时才跳转
          // 如果只是默认参数，留在 index.html 显示登录表单
          if (hash.startsWith('#view=') && hash !== '#view=chat') {
            window.location.href = 'app.html' + hash;
          }
        }
      } catch (e) {
        console.error('检查登录状态失败:', e);
      }
    })();

    // 工具函数
    function setFormMessage(form, message, type = 'error') {
      if (!form) return;
      const messageBox = form.querySelector('.form-message');
      if (!messageBox) return;
      messageBox.textContent = message || '';
      messageBox.classList.remove('is-error', 'is-success');
      if (message) {
        messageBox.classList.add(type === 'success' ? 'is-success' : 'is-error');
      }
    }

    function getToken() {
      return localStorage.getItem('gi_token');
    }

    function storeToken(token) {
      if (!token) return;
      localStorage.setItem('gi_token', token);
    }

    function getStoredUser() {
      try {
        const raw = localStorage.getItem('gi_user');
        return raw ? JSON.parse(raw) : null;
      } catch {
        return null;
      }
    }

    function storeUser(user) {
      if (!user) return;
      localStorage.setItem('gi_user', JSON.stringify(user));
    }

    async function postJson(url, payload) {
      const headers = { 'Content-Type': 'application/json' };
      const response = await fetch(url, {
        method: 'POST',
        headers,
        body: JSON.stringify(payload)
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || data.ok === false) {
        throw new Error(data.error || '请求失败');
      }
      return data;
    }

    // 登录表单处理
    const loginForm = document.getElementById('login-form');
    if (loginForm) {
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const account = loginForm.elements.account?.value.trim();
        const password = loginForm.elements.password?.value;

        if (!account || !password) {
          setFormMessage(loginForm, '请输入账号和密码');
          return;
        }

        try {
          setFormMessage(loginForm, '');
          const data = await postJson('/api/login', { account, password });
          storeToken(data.token);
          storeUser(data.user);
          setFormMessage(loginForm, '登录成功！', 'success');
          setTimeout(() => {
            window.location.href = 'app.html';
          }, 500);
        } catch (err) {
          setFormMessage(loginForm, err.message || '登录失败，请检查账号密码');
        }
      });
    }

    // 注册表单处理
    const registerForm = document.getElementById('register-form');
    if (registerForm) {
      registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = registerForm.elements.name?.value.trim();
        const account = registerForm.elements.account?.value.trim();
        const password = registerForm.elements.password?.value;
        const confirmPassword = registerForm.elements.confirmPassword?.value;

        if (!name || !account || !password || !confirmPassword) {
          setFormMessage(registerForm, '请填写所有必填项');
          return;
        }

        if (password !== confirmPassword) {
          setFormMessage(registerForm, '两次输入的密码不一致');
          return;
        }

        try {
          setFormMessage(registerForm, '');
          const data = await postJson('/api/register', { name, account, password, confirmPassword });
          setFormMessage(registerForm, '注册成功！', 'success');
          setTimeout(() => {
            // 切换到登录表单
            document.querySelector('[data-auth="login"]').click();
          }, 1000);
        } catch (err) {
          setFormMessage(registerForm, err.message || '注册失败，请稍后重试');
        }
      });
    }

    // 标签切换
    const authTabs = document.querySelectorAll('[data-auth]');
    authTabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        authTabs.forEach((t) => t.classList.remove('is-active'));
        tab.classList.add('is-active');
        const isLogin = tab.dataset.auth === 'login';
        loginForm.classList.toggle('is-hidden', !isLogin);
        registerForm.classList.toggle('is-hidden', isLogin);
        if (loginForm) {
          setFormMessage(loginForm, '');
        }
        if (registerForm) {
          setFormMessage(registerForm, '');
        }
      });
    });

    // 密码显示/隐藏
    const passwordToggles = document.querySelectorAll('[data-toggle]');
    passwordToggles.forEach((toggle) => {
      const targetId = toggle.dataset.toggle;
      const input = document.getElementById(targetId);
      if (!input) return;
      toggle.addEventListener('click', () => {
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        toggle.textContent = isPassword ? '隐藏' : '显示';
        toggle.setAttribute('aria-pressed', String(isPassword));
      });
    });
  </script>
</body>
</html>
